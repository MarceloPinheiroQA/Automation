name: Robot Framework Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Select test type to run'
        required: true
        type: choice
        options:
          - API
          - UI
      environment:
        description: 'Environment configuration'
        required: false
        default: 'uat'
        type: choice
        options:
          - uat
          - dev
          - prod
      browser:
        description: 'Browser to use for UI tests'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      headless:
        description: 'Run browser in headless mode'
        required: false
        default: true
        type: boolean

jobs:
  robot-framework-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
        
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Install dependencies (cached)
      if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      run: poetry install --no-interaction --no-root
      
    - name: Install Robot Framework Browser dependencies
      if: inputs.test_type == 'UI'
      run: |
        poetry run rfbrowser init
        
    - name: Setup Xvfb for headless browser testing
      if: inputs.test_type == 'UI' && inputs.headless == true
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        
    - name: Set test tag based on selection
      id: set-test-tag
      run: |
        if [ "${{ inputs.test_type }}" == "API" ]; then
          echo "test_tag=smokeapi" >> $GITHUB_OUTPUT
        else
          echo "test_tag=smokeui" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Results Directory
      run: mkdir -p Results
      
    - name: Run Robot Framework Tests
      run: |
        poetry run robot \
          --outputdir Results \
          --variable BROWSER:${{ inputs.browser }} \
          --variable HEADLESS:${{ inputs.headless }} \
          --variable ENVIRONMENT:${{ inputs.environment }} \
          --include ${{ steps.set-test-tag.outputs.test_tag }} \
          --log log.html \
          --report report.html \
          --output output.xml \
          Tests/
      env:
        DISPLAY: ':99'
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: robot-framework-results-${{ inputs.test_type }}-${{ github.run_number }}
        path: |
          Results/log.html
          Results/report.html
          Results/output.xml
        retention-days: 30
        
    - name: Upload screenshots
      uses: actions/upload-artifact@v3
      if: always()
      if: inputs.test_type == 'UI'
      with:
        name: screenshots-${{ inputs.test_type }}-${{ github.run_number }}
        path: Results/browser/screenshot/
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Upload traces
      uses: actions/upload-artifact@v3
      if: always()
      if: inputs.test_type == 'UI'
      with:
        name: traces-${{ inputs.test_type }}-${{ github.run_number }}
        path: Results/browser/traces/
        retention-days: 30
        if-no-files-found: ignore
