name: Robot Framework Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Select the test suite to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smokeapi
          - smokeui

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  robot-framework-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: robot-framework-tests:latest
      
    - name: Create Results Directory
      run: mkdir -p Results
      
    - name: Run Robot Framework Tests in Docker
      run: |
        # 1. Fallback para garantir que as variáveis nunca fiquem vazias
        SELECTED_GROUP="${{ github.event.inputs.test_group || 'all' }}"
        
        # 2. Lógica simplificada para a tag
        TAG_PARAM=""
        if [ "$SELECTED_GROUP" != "all" ]; then
          TAG_PARAM="--include $SELECTED_GROUP"
        fi

        # 3. Execução limpa: removi as flags --log e --report que estavam causando o erro 252
        # O Robot já gera log.html e report.html automaticamente dentro da pasta Results.
        docker run --rm \
          -v "${{ github.workspace }}/Results:/app/Results" \
          robot-framework-tests:latest \
          --outputdir Results \
          --variable BROWSER:chrome \
          --variable BROWSER_IS_HEADLESS:true \
          -V Data/ConfigFiles/uat.json \
          $TAG_PARAM \
          Tests/
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-results-run-${{ github.run_number }}
        path: Results/
        retention-days: 30
