name: Robot Framework Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Select the test suite to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smokeapi
          - smokeui

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  robot-framework-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: robot-framework-tests:latest
      
    - name: Create Results Directory
      run: mkdir -p Results
      
    - name: Run Robot Framework Tests in Docker
      run: |
        TAG_PARAM=""
        if [ "${{ github.event.inputs.test_group }}" != "all" ] && [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          TAG_PARAM="--include ${{ github.event.inputs.test_group }}"
        fi

        docker run --rm \
          -v "${{ github.workspace }}/Results:/app/Results" \
          robot-framework-tests:latest \
          --outputdir Results \
          --variable BROWSER:${{ inputs.browser }} \
          --variable BROWSER_IS_HEADLESS:${{ inputs.headless }} \
          --variable ENVIRONMENT:${{ inputs.environment }} \
          -V Data/ConfigFiles/uat.json \
          --include ${{ steps.set-test-tag.outputs.test_tag }} \
          --log log.html \
          --report report.html \
          Tests/
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-results-run-${{ github.run_number }}
        path: Results/
        retention-days: 30